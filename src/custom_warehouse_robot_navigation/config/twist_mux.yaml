twist_mux:
  ros__parameters:
    use_sim_time: true
    topics:
      teleop:
        topic: cmd_vel_teleop
        timeout: 0.3
        priority: 100
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
    locks:
      pause:
        topic: pause_navigation
        timeout: 0.0
        priority: 100
