twist_mux:
  ros__parameters:
    use_sim_time: true
    # Navigation only — no teleop in this mux.
    # Nav2 publishes /cmd_vel_nav → mux → /cmd_vel → Gazebo diff_drive.
    # Mapping teleop (slam) publishes /cmd_vel directly when autonav is off.
    topics:
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 100
      # Always-on zeros so Gazebo does not hold the last non-zero cmd_vel
      # when Nav2 / teleop go quiet (twist_mux otherwise stops publishing).
      idle:
        topic: cmd_vel_idle
        timeout: 0.5
        priority: 1
    locks:
      pause:
        topic: pause_navigation
        timeout: 0.0
        priority: 200
